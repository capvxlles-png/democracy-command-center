# Democracy Brewing — Growth Command Center
# Plain static site: no build step, no dependencies.

[build]
  publish = "."

# Security headers. The dashboard talks to Supabase over HTTPS and
# loads the client library from a CDN; nothing else is allowed out.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Never serve a stale dashboard: the HTML is always revalidated.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Same for the proposal — a cached copy of an old commission number
# is exactly the kind of thing that causes an argument in month three.
[[headers]]
  for = "/proposal.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Deliverables get the same treatment — a cached copy of a superseded
# benchmark is worse than no benchmark.
[[headers]]
  for = "/benchmark.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
